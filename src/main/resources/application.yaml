spring:
  application:
    name: microshop
  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  session:
    jdbc:
      initialize-schema: never

microshop:
  app-secret: ${APP_SECRET:}
  setup-token: ${SETUP_TOKEN:}

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_REGEX:(?!)}
      trusted-proxies: '(?!)'
  servlet:
    session:
      timeout: 24h
      cookie:
        name: MICROSHOP_SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    db:
      enabled: true
